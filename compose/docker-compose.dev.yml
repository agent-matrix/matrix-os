name: matrix-os-dev
include:
  - docker-compose.safe.yml
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matrix-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-matrixos}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  matrix-hub:
    image: python:3.11-slim
    command: ["bash", "-lc", "python -m http.server 7300"]
    ports: ["7300:7300"]
    depends_on: [postgres]
  matrix-architect:
    image: python:3.11-slim
    command: ["bash", "-lc", "python -m http.server 8090"]
    ports: ["8090:8090"]
    environment:
      EXECUTION_MODE: dry_run
      REQUIRE_POLICY_GRANT: "true"
volumes:
  postgres_data:
