name: matrix-os-safe
services:
  matrix-llm:
    image: python:3.11-slim
    command: ["bash", "-lc", "python -m http.server 11435"]
    ports: ["11435:11435"]
  matrix-context:
    image: python:3.11-slim
    command: ["bash", "-lc", "python -m http.server 8088"]
    ports: ["8088:8088"]
    volumes: ["matrix_context_data:/data"]
  matrix-ai:
    image: python:3.11-slim
    command: ["bash", "-lc", "python -m http.server 7860"]
    ports: ["7860:7860"]
  matrix-guardian:
    image: python:3.11-slim
    command: ["bash", "-lc", "python -m http.server 8000"]
    ports: ["8000:8000"]
    environment:
      HITL_DEFAULT: "true"
      AUTOPILOT_ENABLED: "false"
  matrixlab:
    image: python:3.11-slim
    command: ["bash", "-lc", "python -m http.server 7070"]
    ports: ["7070:7070"]
    environment:
      ALLOW_NETWORK: "false"
      SANDBOX_ONLY: "true"
volumes:
  matrix_context_data:
