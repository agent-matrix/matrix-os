[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-os"
version = "0.1.0"
description = "Matrix OS kernel: the governed-autonomy loop for the Agent-Matrix ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Agent-Matrix" }]
dependencies = [
  "jsonschema>=4.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
matrix-os = "matrix_os.cli:main"

[tool.setuptools]
packages = ["matrix_os", "matrix_os.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
